# 앱 지표는 15초로 긁는다. 페일오버 2분이나 인스턴스 전환 30초 같은 짧은 사건을 보려면 이 해상도가 필요하다.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: freshmarket

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # 앱은 ASG 가 교체하므로 주소가 바뀐다. 정적 목록을 쓸 수 없다.
  # EC2 서비스 디스커버리로 태그를 보고 찾는다.
  - job_name: app
    metrics_path: /actuator/prometheus
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8081
        filters:
          - name: tag:Role
            values: [app]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance

  - job_name: batch
    metrics_path: /actuator/prometheus
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8081
        filters:
          - name: tag:Role
            values: [batch]
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance

  # 호스트 지표. CPU 크레딧이 여기서 나온다.
  - job_name: node
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 9100
        filters:
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance
      - source_labels: [__meta_ec2_tag_Role]
        target_label: role

  # 컨테이너 지표. OOM 감지가 여기서 나온다.
  - job_name: cadvisor
    ec2_sd_configs:
      - region: ap-northeast-2
        port: 8082
        filters:
          - name: instance-state-name
            values: [running]
    relabel_configs:
      - source_labels: [__meta_ec2_tag_Name]
        target_label: instance

  - job_name: mysqld
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # CloudWatch 지표 자체가 60초 해상도다.
  # 15초로 긁으면 같은 값을 네 번 받으면서 API 요청만 네 배가 되어 무료 한도를 넘는다.
  - job_name: cloudwatch
    scrape_interval: 60s
    static_configs:
      - targets: ["cloudwatch-exporter:9106"]
