# ALB, RDS, ElastiCache 의 인스턴스 레벨 지표를 CloudWatch 에서 가져온다.
# period 와 range 는 CloudWatch 원본 해상도인 60초에 맞춘다. 더 촘촘히 긁으면 API 요청만 늘어난다.
region: ap-northeast-2
period_seconds: 60
range_seconds: 300

metrics:
  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_ELB_5XX_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: HTTPCode_ELB_502_Count
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: TargetResponseTime
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Average, p99]

  - aws_namespace: AWS/ApplicationELB
    aws_metric_name: ConsumedLCUs
    aws_dimensions: [LoadBalancer]
    aws_statistics: [Sum]

  - aws_namespace: AWS/RDS
    aws_metric_name: FreeableMemory
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]

  - aws_namespace: AWS/RDS
    aws_metric_name: DatabaseConnections
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average, Maximum]

  # 크레딧은 서서히 변한다. 300초로 긁어 API 요청을 아낀다.
  - aws_namespace: AWS/RDS
    aws_metric_name: CPUCreditBalance
    aws_dimensions: [DBInstanceIdentifier]
    aws_statistics: [Average]
    period_seconds: 300

  - aws_namespace: AWS/ElastiCache
    aws_metric_name: CPUCreditBalance
    aws_dimensions: [CacheClusterId]
    aws_statistics: [Average]
    period_seconds: 300
